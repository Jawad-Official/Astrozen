services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astrozen
      POSTGRES_PASSWORD: astrozen_dev_only
      POSTGRES_DB: astrozen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrozen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
    ports:
      - "18010:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://astrozen:astrozen_dev_only@postgres:5432/astrozen
      # Local-dev-only value, generated for this compose stack. Never a real
      # secret - rotate/regenerate freely, and never reuse in production.
      JWT_SECRET: a6e6eef63418108c286b2467bf5144f663952b599d031926a15709f7e5af2388
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      PROJECT_NAME: Astrozen API
      VERSION: 1.0.0
      API_V1_PREFIX: /api/v1
      ENVIRONMENT: development
      RATE_LIMIT_ENABLED: "true"
      # pydantic-settings tries to JSON-decode any List[str] field read from
      # a real process env var before the app's own comma-separated-string
      # parser ever runs - a plain "http://a,http://b" value raises
      # SettingsError here even though config.py's parse_cors_origins
      # validator supports that shape. JSON array syntax is required.
      BACKEND_CORS_ORIGINS: '["http://localhost:18011"]'
      # GEMINI_API_KEY / GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / R2_*
      # deliberately left unset: those integrations degrade gracefully
      # (each service logs a warning and disables itself, per app startup
      # logging) rather than failing the whole app. Set real values here to
      # exercise AI generation, Google Docs sync, or R2 storage locally.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: http://localhost:18010/api/v1
    ports:
      - "18011:80"
    depends_on:
      - backend

volumes:
  postgres_data:
