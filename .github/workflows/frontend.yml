name: Frontend CI and Deploy to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # Vite bakes env vars into the static bundle at build time. This
          # build runs inside GitHub Actions (nwtgck/actions-netlify below
          # only uploads the already-built dist/ folder afterward), so
          # Netlify's own dashboard-configured env vars are never consulted
          # for this build - setting VITE_API_BASE_URL there alone does
          # nothing. Not a secret (it's the public backend URL), so it's
          # set directly here rather than requiring a GitHub secret.
          VITE_API_BASE_URL: https://astrozen-backend-zwnw.onrender.com/api/v1
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ./dist
          production-branch: main
          # nwtgck/actions-netlify defaults production-deploy to false
          # regardless of production-branch - without this, every deploy
          # here was published as a throwaway draft (its own
          # <deploy-id>--astrozen.netlify.app URL) and the real
          # astrozen.netlify.app alias never advanced past whatever was
          # last deployed by hand. This job already runs only on pushes to
          # main (see the job-level `if` above), so always publishing to
          # production here is correct.
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
